<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arr3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6a817"/>
    </marker>
  </defs>
  <rect width="1300" height="820" fill="#fafafa"/>
  <text x="650" y="34" text-anchor="middle" font-size="22" font-weight="bold">LO 合成与分配树（规划级 v1.0）</text>
  <text x="650" y="58" text-anchor="middle" font-size="13" fill="#555">ΣΔ 分数N PLL → 双带 VCO → ÷2（2.4G）/ 直通（5/6G）→ 多相正交 → 25% 占空整形 → 星形等长缓冲树 → 混频器</text>

  <!-- XTAL -->
  <rect x="80" y="360" width="120" height="60" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
  <text x="140" y="385" text-anchor="middle" font-size="13" font-weight="bold">晶振 ref</text>
  <text x="140" y="404" text-anchor="middle" font-size="11">（XTAL pad）</text>
  <line x1="200" y1="390" x2="250" y2="390" stroke="#37474f" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- PLL -->
  <rect x="250" y="350" width="170" height="80" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="335" y="378" text-anchor="middle" font-size="13.5" font-weight="bold">PLL · ΣΔ 分数N</text>
  <text x="335" y="398" text-anchor="middle" font-size="11">三阶 2-1 MASH（假设）</text>
  <text x="335" y="415" text-anchor="middle" font-size="11">环路 BW 1.6 MHz（R-01 终裁）</text>

  <line x1="420" y1="390" x2="470" y2="390" stroke="#37474f" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- VCO -->
  <rect x="470" y="350" width="180" height="80" fill="#fff8e1" stroke="#f9a825" stroke-width="2.4"/>
  <text x="560" y="378" text-anchor="middle" font-size="13.5" font-weight="bold">VCO 4.8–7.2 GHz</text>
  <text x="560" y="398" text-anchor="middle" font-size="11">双子带 LC-VCO</text>
  <text x="560" y="415" text-anchor="middle" font-size="11">@1M ≤ −129 dBc/Hz（spec §8）</text>

  <!-- branch 5/6G -->
  <line x1="650" y1="370" x2="740" y2="290" stroke="#e6a817" stroke-width="2.2" marker-end="url(#arr3a)"/>
  <rect x="740" y="255" width="150" height="70" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="815" y="283" text-anchor="middle" font-size="12.5" font-weight="bold">直通（5/6G）</text>
  <text x="815" y="303" text-anchor="middle" font-size="11">4.9–7.125 GHz 档</text>

  <!-- branch 2.4G -->
  <line x1="650" y1="410" x2="740" y2="470" stroke="#e6a817" stroke-width="2.2" marker-end="url(#arr3a)"/>
  <rect x="740" y="440" width="150" height="70" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="815" y="468" text-anchor="middle" font-size="12.5" font-weight="bold">÷2（2.4G）</text>
  <text x="815" y="488" text-anchor="middle" font-size="11">2.4–2.4835 GHz 档</text>

  <!-- poly phase -->
  <line x1="890" y1="290" x2="950" y2="330" stroke="#e6a817" stroke-width="2.2" marker-end="url(#arr3a)"/>
  <line x1="890" y1="475" x2="950" y2="435" stroke="#e6a817" stroke-width="2.2" marker-end="url(#arr3a)"/>
  <rect x="950" y="330" width="160" height="105" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="1030" y="360" text-anchor="middle" font-size="12.5" font-weight="bold">多相正交产生</text>
  <text x="1030" y="380" text-anchor="middle" font-size="11">RC-CR 两级多相滤波</text>
  <text x="1030" y="398" text-anchor="middle" font-size="11">正交误差 0.3°/0.05dB（校准后）</text>
  <text x="1030" y="416" text-anchor="middle" font-size="11">（spec §7 预算）</text>

  <!-- 25% shaping -->
  <line x1="1110" y1="382" x2="1160" y2="382" stroke="#e6a817" stroke-width="2.2" marker-end="url(#arr3a)"/>
  <rect x="1160" y="340" width="120" height="85" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="1220" y="370" text-anchor="middle" font-size="12.5" font-weight="bold">25% 占空整形</text>
  <text x="1220" y="390" text-anchor="middle" font-size="11">脉冲交叠生成</text>
  <text x="1220" y="407" text-anchor="middle" font-size="11">（贴近混频器摆）</text>

  <!-- buffer tree to mixers -->
  <line x1="1220" y1="425" x2="1220" y2="560" stroke="#e6a817" stroke-width="2.2" marker-end="url(#arr3a)"/>
  <rect x="1050" y="560" width="230" height="56" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="1165" y="583" text-anchor="middle" font-size="12.5" font-weight="bold">缓冲树 1→2→4（星形等长）</text>
  <text x="1165" y="602" text-anchor="middle" font-size="11">每叶独立电源退耦 · 包地走线</text>

  <g font-size="12" font-weight="bold">
    <line x1="1050" y1="600" x2="960" y2="660" stroke="#e6a817" stroke-width="2" marker-end="url(#arr3a)"/>
    <line x1="1100" y1="616" x2="1030" y2="690" stroke="#e6a817" stroke-width="2" marker-end="url(#arr3a)"/>
    <line x1="1180" y1="616" x2="1230" y2="690" stroke="#e6a817" stroke-width="2" marker-end="url(#arr3a)"/>
    <line x1="1250" y1="600" x2="1290" y2="655" stroke="#e6a817" stroke-width="2" marker-end="url(#arr3a)"/>
  </g>
  <g font-size="11.5" fill="#7a5c00">
    <text x="905" y="680">MIX_I_5G</text>
    <text x="995" y="710">MIX_Q_5G</text>
    <text x="1200" y="710">MIX_I_2G</text>
    <text x="1270" y="675">MIX_Q_2G</text>
  </g>

  <!-- annotations -->
  <rect x="80" y="520" width="330" height="220" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="95" y="548" font-size="13" font-weight="bold" fill="#37474f">版图规则（对应图 1/图 2）</text>
  <text x="95" y="576" font-size="12">· LO 走线包地（同轴式：地-信号-地），贴地平面</text>
  <text x="95" y="600" font-size="12">· IQ 四相走线对称等长，避免相移失配</text>
  <text x="95" y="624" font-size="12">· 走线层避开 PA 电感/变压器投影区</text>
  <text x="95" y="648" font-size="12">· 每级缓冲独立 LDO 抽头 + 就地 decap</text>
  <text x="95" y="672" font-size="12">· 25% 整形器贴近混频器栅（缩短高速节点）</text>
  <text x="95" y="700" font-size="12" fill="#c62828">· IPN ≤−48 dBc 预算 → 隔离按图 2 剖面执行</text>

  <text x="80" y="790" font-size="12.5" fill="#555">占空 50%→25% 转换在多相之后完成；2.4G 档由 ÷2 天生正交时，多相级可旁路（架构 §4）——版图预留旁路走线。</text>
  <text x="1220" y="800" font-size="12" fill="#777">图 3 / 6</text>
</svg>
