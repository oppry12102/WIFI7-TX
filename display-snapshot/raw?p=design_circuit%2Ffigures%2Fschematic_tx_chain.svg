<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arr4r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="arr4o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6a817"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#fafafa"/>
  <text x="700" y="34" text-anchor="middle" font-size="22" font-weight="bold">TX 模拟链路全图（一路示出 · 规划级 v1.0）</text>
  <text x="700" y="58" text-anchor="middle" font-size="13" fill="#555">直接变频：DAC → 重构 LPF → VGA → gm 级 + 25% 占空无源正交混频 → 频段分路 → 驱动级 → 功率级 → 片上变压器 → RF 焊盘</text>
  <text x="700" y="78" text-anchor="middle" font-size="12" fill="#777">增益/功耗等最终数值口径以 design_circuit v1.4 / params.csv 为准（本图为拓扑与校准回环示意，不引入新判定数值）</text>

  <!-- main chain -->
  <g font-size="12">
    <rect x="60" y="180" width="140" height="110" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="130" y="215" text-anchor="middle" font-size="13" font-weight="bold">DAC（I/Q）</text>
    <text x="130" y="237" text-anchor="middle" font-size="11">12b 电流舵</text>
    <text x="130" y="254" text-anchor="middle" font-size="11">6b二进制+6b温度计</text>
    <text x="130" y="271" text-anchor="middle" font-size="11">1.28 Gsps</text>

    <rect x="240" y="180" width="150" height="110" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="315" y="215" text-anchor="middle" font-size="13" font-weight="bold">重构 LPF</text>
    <text x="315" y="237" text-anchor="middle" font-size="11">4 阶 Butterworth</text>
    <text x="315" y="254" text-anchor="middle" font-size="11">fc ≈ 420 MHz</text>
    <text x="315" y="271" text-anchor="middle" font-size="11">active-RC（可调）</text>

    <rect x="430" y="180" width="140" height="110" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="500" y="215" text-anchor="middle" font-size="13" font-weight="bold">VGA</text>
    <text x="500" y="237" text-anchor="middle" font-size="11">0~15 dB / 0.5dB 步</text>
    <text x="500" y="254" text-anchor="middle" font-size="11">±0.1dB 平坦度</text>

    <rect x="610" y="180" width="190" height="110" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.4"/>
    <text x="705" y="212" text-anchor="middle" font-size="13" font-weight="bold">gm 级 + 无源混频</text>
    <text x="705" y="234" text-anchor="middle" font-size="11">gm 共源共栅 → 25% 占空</text>
    <text x="705" y="251" text-anchor="middle" font-size="11">无源 nMOS 开关（正交）</text>
    <text x="705" y="268" text-anchor="middle" font-size="11">净转换增益 ≈ 0 dB（详图 6）</text>

    <rect x="840" y="150" width="120" height="80" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="900" y="185" text-anchor="middle" font-size="12.5" font-weight="bold">驱动级 5/6G</text>
    <text x="900" y="205" text-anchor="middle" font-size="11">+6 dB · 1.8V</text>
    <rect x="840" y="250" width="120" height="80" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="900" y="285" text-anchor="middle" font-size="12.5" font-weight="bold">驱动级 2.4G</text>
    <text x="900" y="305" text-anchor="middle" font-size="11">同构</text>

    <rect x="1000" y="150" width="140" height="80" fill="#ffcdd2" stroke="#b71c1c" stroke-width="2.4"/>
    <text x="1070" y="185" text-anchor="middle" font-size="12.5" font-weight="bold">功率级 5/6G</text>
    <text x="1070" y="205" text-anchor="middle" font-size="11">3.3V 厚氧（详图 5）</text>
    <rect x="1000" y="250" width="140" height="80" fill="#ffcdd2" stroke="#b71c1c" stroke-width="2.4"/>
    <text x="1070" y="285" text-anchor="middle" font-size="12.5" font-weight="bold">功率级 2.4G</text>
    <text x="1070" y="305" text-anchor="middle" font-size="11">同构双路</text>

    <rect x="1180" y="180" width="90" height="120" fill="#ffffff" stroke="#b71c1c" stroke-width="2"/>
    <text x="1225" y="230" text-anchor="middle" font-size="12.5" font-weight="bold">TXFM ×2</text>
    <text x="1225" y="250" text-anchor="middle" font-size="11">合成/巴伦</text>
    <text x="1225" y="268" text-anchor="middle" font-size="11">+ 调谐阵列</text>
  </g>

  <g stroke="#37474f" stroke-width="2.2">
    <line x1="200" y1="235" x2="240" y2="235" marker-end="url(#arr4)"/>
    <line x1="390" y1="235" x2="430" y2="235" marker-end="url(#arr4)"/>
    <line x1="570" y1="235" x2="610" y2="235" marker-end="url(#arr4)"/>
    <line x1="800" y1="225" x2="840" y2="190" marker-end="url(#arr4)"/>
    <line x1="800" y1="245" x2="840" y2="290" marker-end="url(#arr4)"/>
    <line x1="960" y1="190" x2="1000" y2="190" marker-end="url(#arr4)"/>
    <line x1="960" y1="290" x2="1000" y2="290" marker-end="url(#arr4)"/>
    <line x1="1140" y1="190" x2="1180" y2="215" marker-end="url(#arr4)"/>
    <line x1="1140" y1="290" x2="1180" y2="265" marker-end="url(#arr4)"/>
  </g>
  <text x="820" y="160" text-anchor="middle" font-size="10.5" fill="#555">混频输出 RF 合成→频段分路（开关）</text>
  <text x="1335" y="205" font-size="13" font-weight="bold" fill="#b71c1c">RF1/RF2</text>
  <text x="1335" y="224" font-size="11" fill="#555">低容 ESD 焊盘</text>
  <line x1="1270" y1="235" x2="1325" y2="235" stroke="#b71c1c" stroke-width="2.5" marker-end="url(#arr4r)"/>

  <!-- LO rail -->
  <rect x="610" y="430" width="500" height="70" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="860" y="458" text-anchor="middle" font-size="13" font-weight="bold">LO 4.8–7.2 GHz（÷2 → 2.4G）· 25% 占空整形（详图 3）</text>
  <text x="860" y="480" text-anchor="middle" font-size="11">0°/90°/180°/270° 四相 → 混频器开关栅</text>
  <line x1="760" y1="430" x2="735" y2="290" stroke="#e6a817" stroke-width="2.4" marker-end="url(#arr4o)"/>
  <text x="775" y="365" font-size="11" fill="#7a5c00">LO 注入</text>

  <!-- bias/control rail -->
  <rect x="60" y="430" width="440" height="70" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2"/>
  <text x="280" y="458" text-anchor="middle" font-size="13" font-weight="bold">偏置 / 带隙基准 / SPI</text>
  <text x="280" y="480" text-anchor="middle" font-size="11">各模块偏置 DAC + 带隙 → 各域 LDO（图 2 三域）</text>
  <line x1="280" y1="430" x2="280" y2="290" stroke="#3f51b5" stroke-width="1.6" stroke-dasharray="5,4"/>
  <line x1="500" y1="445" x2="500" y2="290" stroke="#3f51b5" stroke-width="1.6" stroke-dasharray="5,4"/>

  <!-- feedback loop -->
  <rect x="1000" y="430" width="260" height="90" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
  <text x="1130" y="460" text-anchor="middle" font-size="12.5" font-weight="bold">定向耦合器 −25 dB（输出网络内）</text>
  <text x="1130" y="482" text-anchor="middle" font-size="11">→ 对数 RF 检波 → SAR ADC</text>
  <text x="1130" y="500" text-anchor="middle" font-size="11">闭环功控 ±1.5 dB（spec S12）</text>
  <polyline points="1225,290 1225,430" fill="none" stroke="#00838f" stroke-width="1.8" stroke-dasharray="4,3"/>
  <polyline points="1000,475 530,475 530,410 230,410 230,290" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr4r)"/>
  <text x="740" y="545" text-anchor="middle" font-size="12" fill="#c62828">校准/功控回环：ADC 读回 → 数字功控/温漂跟踪（100 ms）→ 功控 DAC / LOFT-DC / IQ 系数回写</text>
  <line x1="530" y1="410" x2="530" y2="410" stroke="#c62828" stroke-width="2"/>

  <!-- calibration items -->
  <rect x="60" y="590" width="620" height="150" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="75" y="618" font-size="13" font-weight="bold" fill="#37474f">校准项（spec §7 / architecture §5）</text>
  <text x="75" y="646" font-size="12">· LO 馈通：数字 DC 补偿（产测粗调 + 运行微调）</text>
  <text x="75" y="672" font-size="12">· IQ 不平衡：产测一次校准 + 温漂查表（幅度/相位预矫正系数回 DAC 前）</text>
  <text x="75" y="698" font-size="12">· PA 温漂：功率检测闭环跟踪（周期 100 ms）· DPD：数字域（GMP，另列）</text>
  <text x="75" y="724" font-size="11" fill="#777">观测路：产品无片内 TX→RX 回环，行为级验证用模型回环（sim_report 口径）</text>

  <!-- band note -->
  <rect x="720" y="590" width="620" height="150" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="735" y="618" font-size="13" font-weight="bold" fill="#37474f">双路频段策略（architecture §1）</text>
  <text x="735" y="646" font-size="12">· 2.4 GHz 独立一路（频率比 >2×，分路效率优）</text>
  <text x="735" y="672" font-size="12">· 5/6 GHz（4.9–7.125）共用宽带一路：片上变压器 + 开关电容调谐覆盖</text>
  <text x="735" y="698" font-size="12">· 本图一路全链示出；第二路同构（基带/混频共用，驱动/PA/变压器独立）</text>
  <text x="735" y="724" font-size="11" fill="#777">混频器共用一套（I/Q），分路开关位于混频输出与驱动级之间</text>
  <text x="1310" y="870" font-size="12" fill="#777">图 4 / 6</text>
</svg>
