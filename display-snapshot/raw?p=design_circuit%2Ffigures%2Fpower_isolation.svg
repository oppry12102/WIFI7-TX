<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="sub" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#eceff1"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#90a4ae" stroke-width="1"/>
    </pattern>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="1300" height="880" fill="#fafafa"/>
  <text x="650" y="34" text-anchor="middle" font-size="22" font-weight="bold">电源域划分与隔离结构（规划级 v1.0）</text>
  <text x="650" y="58" text-anchor="middle" font-size="13" fill="#555">左：俯视三域划分（口径以 design_circuit v1.4 为准）· 右：衬底剖面示意（深 N 阱岛式隔离 + 双 guard ring）</text>

  <!-- Panel A: power domains top view -->
  <text x="330" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">A · 电源域俯视（floorplan 缩略）</text>
  <rect x="60" y="115" width="540" height="560" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <!-- 1.1V domain -->
  <rect x="80" y="135" width="200" height="180" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2"/>
  <text x="180" y="170" text-anchor="middle" font-size="13" font-weight="bold">1.1V 域</text>
  <text x="180" y="195" text-anchor="middle" font-size="11.5">数字接口 / 校准逻辑</text>
  <text x="180" y="215" text-anchor="middle" font-size="11.5">PLL 数字部分（ΣΔ/鉴频）</text>
  <text x="180" y="235" text-anchor="middle" font-size="11.5">SAR ADC</text>
  <text x="180" y="258" text-anchor="middle" font-size="10.5" fill="#555">LDO：PSRR 标准</text>
  <!-- 1.8V domain -->
  <rect x="300" y="135" width="200" height="380" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="400" y="170" text-anchor="middle" font-size="13" font-weight="bold">1.8V 域</text>
  <text x="400" y="195" text-anchor="middle" font-size="11.5">DAC ×2 / LPF ×2 / VGA ×2</text>
  <text x="400" y="215" text-anchor="middle" font-size="11.5">gm 级 + 无源混频</text>
  <text x="400" y="235" text-anchor="middle" font-size="11.5">驱动级 ×2 · LO 缓冲/整形</text>
  <text x="400" y="258" text-anchor="middle" font-size="11.5">VCO 芯（岛中岛，独立 LDO）</text>
  <text x="400" y="281" text-anchor="middle" font-size="10.5" fill="#555">干净域：LDO 级联 PSRR 增强</text>
  <!-- 3.3V domain -->
  <rect x="300" y="535" width="280" height="120" fill="#ffcdd2" stroke="#b71c1c" stroke-width="2.2"/>
  <text x="440" y="568" text-anchor="middle" font-size="13" font-weight="bold">3.3V 域（PA）</text>
  <text x="440" y="592" text-anchor="middle" font-size="11.5">功率级 ×2 + 片上变压器 CT</text>
  <text x="440" y="612" text-anchor="middle" font-size="11.5">专用电源环 · 加宽金属 · 独立 bond</text>
  <!-- note zones -->
  <text x="130" y="430" font-size="11.5" fill="#37474f">检测路（1.8V）：</text>
  <text x="130" y="450" font-size="11.5" fill="#37474f">对数检波 + 耦合器偏置</text>
  <text x="130" y="485" font-size="11.5" fill="#37474f">带隙基准全片共享，</text>
  <text x="130" y="505" font-size="11.5" fill="#37474f">各域独立 LDO 后收敛</text>
  <rect x="80" y="535" width="180" height="120" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
  <text x="170" y="568" text-anchor="middle" font-size="12.5" font-weight="bold">LDO/decap 带</text>
  <text x="170" y="590" text-anchor="middle" font-size="11">沿 die 下缘，各域就近</text>
  <text x="170" y="610" text-anchor="middle" font-size="11">电源入口 → LDO → 岛</text>
  <line x1="300" y1="325" x2="300" y2="525" stroke="#777" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="252" y="530" font-size="10.5" fill="#777">域边界=guard ring</text>

  <g font-size="12">
    <rect x="80" y="700" width="16" height="16" fill="#e8eaf6" stroke="#3f51b5"/><text x="102" y="713">1.1V 数字</text>
    <rect x="190" y="700" width="16" height="16" fill="#e8f5e9" stroke="#2e7d32"/><text x="212" y="713">1.8V 模拟/RF 前端</text>
    <rect x="360" y="700" width="16" height="16" fill="#ffcdd2" stroke="#b71c1c"/><text x="382" y="713">3.3V PA</text>
  </g>
  <text x="80" y="745" font-size="11.5" fill="#555">规则：跨域信号全部过缓冲/电平移位；域间无长并行走线；各域 LDO 输出独立退耦（>2nF/mm² 目标）</text>

  <!-- Panel B: cross section -->
  <text x="960" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">B · 衬底隔离剖面（示意）</text>
  <rect x="680" y="115" width="560" height="560" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
  <!-- substrate -->
  <rect x="700" y="560" width="520" height="90" fill="url(#sub)" stroke="#607d8b" stroke-width="1.5"/>
  <text x="960" y="610" text-anchor="middle" font-size="12.5" fill="#37474f">P+ 高阻衬底（背注 / GND 缝合，最短噪声回流）</text>
  <rect x="700" y="500" width="520" height="60" fill="#f5f5f5" stroke="#607d8b" stroke-width="1"/>
  <text x="960" y="535" text-anchor="middle" font-size="12" fill="#37474f">P− 外延层</text>
  <!-- LO island DNW -->
  <rect x="730" y="400" width="220" height="100" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8"/>
  <text x="840" y="425" text-anchor="middle" font-size="12" font-weight="bold">深 N 阱岛 ①（LO/VCO）</text>
  <rect x="750" y="440" width="180" height="40" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="840" y="465" text-anchor="middle" font-size="11">N 阱 / P 阱 · VCO 芯</text>
  <!-- PA island -->
  <rect x="1010" y="400" width="160" height="100" fill="#ffebee" stroke="#b71c1c" stroke-width="1.8"/>
  <text x="1090" y="425" text-anchor="middle" font-size="12" font-weight="bold">PA 岛 ②</text>
  <rect x="1025" y="440" width="130" height="40" fill="#ffcdd2" stroke="#b71c1c" stroke-width="1"/>
  <text x="1090" y="465" text-anchor="middle" font-size="11">厚氧功率管</text>
  <!-- guard rings -->
  <g font-size="10.5">
    <rect x="722" y="392" width="236" height="10" fill="#66bb6a" stroke="#2e7d32"/>
    <rect x="722" y="492" width="236" height="10" fill="#66bb6a" stroke="#2e7d32"/>
    <rect x="722" y="392" width="10" height="110" fill="#66bb6a" stroke="#2e7d32"/>
    <rect x="948" y="392" width="10" height="110" fill="#66bb6a" stroke="#2e7d32"/>
    <rect x="1002" y="392" width="176" height="10" fill="#66bb6a" stroke="#2e7d32"/>
    <rect x="1002" y="492" width="176" height="10" fill="#66bb6a" stroke="#2e7d32"/>
    <rect x="1002" y="392" width="10" height="110" fill="#66bb6a" stroke="#2e7d32"/>
    <rect x="1168" y="392" width="10" height="110" fill="#66bb6a" stroke="#2e7d32"/>
  </g>
  <text x="840" y="385" text-anchor="middle" font-size="10.5" fill="#2e7d32">P+ ring（接 GND）+ N+ ring（接 1.8V）双环</text>
  <text x="1090" y="385" text-anchor="middle" font-size="10.5" fill="#2e7d32">双 guard ring</text>
  <!-- deep trench -->
  <rect x="975" y="380" width="14" height="130" fill="#455a64"/>
  <text x="982" y="370" text-anchor="middle" font-size="11" fill="#455a64">深沟槽 DTI</text>
  <!-- spacing arrow -->
  <line x1="950" y1="525" x2="1010" y2="525" stroke="#37474f" stroke-width="2" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="980" y="548" text-anchor="middle" font-size="10.5" fill="#37474f">间距</text>
  <!-- top annotation -->
  <text x="960" y="150" text-anchor="middle" font-size="12.5" fill="#37474f">摆位呼应图 1：VCO 岛与 PA 岛对角摆置，硅上直线距离 ≥ 200 µm 量级</text>
  <text x="960" y="172" text-anchor="middle" font-size="12.5" fill="#37474f">敏感模拟（DAC/LPF/VGA）置于 LO 岛与 PA 岛之间靠 1.8V 干净域</text>
  <text x="960" y="200" text-anchor="middle" font-size="11.5" fill="#555">衬底噪声路径：PA → 衬底 → VCO，由「距离 + DTI + 双 guard ring + 独立 DNW」四重衰减</text>
  <text x="960" y="222" text-anchor="middle" font-size="11.5" fill="#555">VCO 相噪对衬底耦合最敏感（IPN ≤−48 dBc 预算），故 LO 岛电源独立 LDO + 岛中岛</text>
  <text x="1220" y="710" font-size="12" fill="#777">图 2 / 6</text>
</svg>
