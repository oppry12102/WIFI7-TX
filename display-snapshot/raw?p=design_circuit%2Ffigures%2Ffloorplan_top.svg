<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fff8e1"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e6a817" stroke-width="1.4"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="1400" height="1000" fill="#fafafa"/>
  <text x="700" y="34" text-anchor="middle" font-size="22" font-weight="bold">Wi-Fi 7 TX 模组 · 顶层版图规划（floorplan · 规划级 v1.0）</text>
  <text x="700" y="58" text-anchor="middle" font-size="13" fill="#555">40nm CMOS（假设）· die ≈ 2.1 × 1.35 mm · 直接变频 · 双功率路（2.4G 独立 / 5–6G 宽带共路）· 非 GDS：示相对摆位与隔离拓扑</text>

  <!-- die outline + pad ring -->
  <rect x="110" y="80" width="1180" height="760" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <rect x="146" y="116" width="1108" height="688" fill="none" stroke="#999" stroke-width="1"/>
  <text x="200" y="105" font-size="12" fill="#777">pad ring（GND 填充）</text>

  <!-- pads: bottom power -->
  <g font-size="11" fill="#333">
    <rect x="200" y="826" width="26" height="12" fill="#555"/><text x="200" y="856">GND</text>
    <rect x="260" y="826" width="26" height="12" fill="#00838f"/><text x="252" y="856">1.1V</text>
    <rect x="330" y="826" width="26" height="12" fill="#00838f"/><text x="322" y="856">1.8V</text>
    <rect x="400" y="826" width="26" height="12" fill="#00838f"/><text x="392" y="856">1.8V</text>
    <rect x="470" y="826" width="26" height="12" fill="#b71c1c"/><text x="460" y="856">3.3V</text>
    <rect x="540" y="826" width="26" height="12" fill="#555"/><text x="540" y="856">GND</text>
    <rect x="600" y="826" width="26" height="12" fill="#555"/><text x="600" y="856">GND</text>
    <rect x="660" y="826" width="26" height="12" fill="#00838f"/><text x="652" y="856">1.1V</text>
  </g>
  <!-- pads: left digital -->
  <g font-size="11" fill="#333">
    <rect x="84" y="200" width="12" height="26" fill="#3f51b5"/><text x="30" y="196">SPI</text>
    <rect x="84" y="300" width="12" height="26" fill="#3f51b5"/><text x="24" y="296">DATA</text>
    <rect x="84" y="400" width="12" height="26" fill="#3f51b5"/><text x="22" y="396">CLK</text>
    <rect x="84" y="500" width="12" height="26" fill="#3f51b5"/><text x="16" y="496">EN/CTL</text>
    <rect x="84" y="600" width="12" height="26" fill="#f9a825"/><text x="30" y="640">XTAL ref</text>
  </g>
  <!-- pads: right RF -->
  <g font-size="12" fill="#b71c1c" font-weight="bold">
    <rect x="1276" y="330" width="16" height="40" fill="#b71c1c"/><text x="1296" y="345">RF1</text>
    <rect x="1276" y="530" width="16" height="40" fill="#b71c1c"/><text x="1296" y="545">RF2</text>
  </g>
  <g font-size="11" fill="#555">
    <text x="1296" y="362">5/6G out</text>
    <text x="1296" y="562">2.4G out</text>
  </g>
  <!-- pads: top test -->
  <g font-size="11" fill="#333">
    <rect x="700" y="86" width="26" height="12" fill="#777"/><text x="692" y="78">TEST</text>
    <rect x="800" y="86" width="26" height="12" fill="#777"/><text x="792" y="78">TEST</text>
    <rect x="900" y="86" width="26" height="12" fill="#777"/><text x="892" y="78">AUX</text>
  </g>

  <!-- LO island -->
  <rect x="336" y="118" width="248" height="146" fill="none" stroke="#b8860b" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="340" y="278" font-size="11" fill="#b8860b">LO 岛：深 N 阱 + 双 guard ring + 独立电源</text>
  <rect x="350" y="132" width="220" height="118" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="460" y="178" text-anchor="middle" font-size="14" font-weight="bold">LO 合成</text>
  <text x="460" y="198" text-anchor="middle" font-size="11">PLL ΣΔ 分数N（BW 1.6M）</text>
  <text x="460" y="214" text-anchor="middle" font-size="11">VCO 4.8–7.2G 双带 · ÷2(2.4G)/直通</text>
  <text x="460" y="230" text-anchor="middle" font-size="11">多相 IQ → 25% 占空整形</text>

  <!-- LO corridor -->
  <rect x="580" y="160" width="560" height="52" fill="url(#hatch)" stroke="#e6a817" stroke-width="1.2"/>
  <text x="860" y="182" text-anchor="middle" font-size="12" fill="#7a5c00">LO 分配走廊：包地屏蔽 · 星形等长 · 逐级缓冲独立退耦</text>
  <text x="860" y="200" text-anchor="middle" font-size="11" fill="#7a5c00">（避开 PA 电感投影区，走线层贴地）</text>
  <line x1="580" y1="186" x2="540" y2="186" stroke="#e6a817" stroke-width="2"/>
  <line x1="460" y1="250" x2="460" y2="290" stroke="#e6a817" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="212" x2="640" y2="296" stroke="#e6a817" stroke-width="2" marker-end="url(#arr)" transform="translate(-110,0)"/>
  <line x1="500" y1="250" x2="500" y2="480" stroke="#e6a817" stroke-width="2" transform="translate(-170,0)"/>
  <line x1="330" y1="480" x2="516" y2="480" stroke="#e6a817" stroke-width="2" marker-end="url(#arr)"/>

  <!-- digital interface -->
  <rect x="160" y="300" width="140" height="300" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2"/>
  <text x="230" y="345" text-anchor="middle" font-size="14" font-weight="bold">数字接口</text>
  <text x="230" y="363" text-anchor="middle" font-size="11">与校准/功控逻辑</text>
  <text x="230" y="385" text-anchor="middle" font-size="11">（1.1V 域）</text>
  <text x="230" y="412" text-anchor="middle" font-size="11">· SPI/数据接口</text>
  <text x="230" y="432" text-anchor="middle" font-size="11">· 功控闭环（100ms）</text>
  <text x="230" y="452" text-anchor="middle" font-size="11">· LOFT/IQ 校准系数</text>
  <text x="230" y="472" text-anchor="middle" font-size="11">· ADC 读回</text>

  <!-- baseband I/Q -->
  <rect x="320" y="300" width="180" height="110" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="410" y="335" text-anchor="middle" font-size="13" font-weight="bold">基带 I 路（1.8V）</text>
  <text x="410" y="357" text-anchor="middle" font-size="11">DAC 12b/1.28Gsps →</text>
  <text x="410" y="374" text-anchor="middle" font-size="11">重构 LPF（4阶 fc 420M）→</text>
  <text x="410" y="391" text-anchor="middle" font-size="11">VGA 0~15dB</text>
  <rect x="320" y="430" width="180" height="110" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="410" y="465" text-anchor="middle" font-size="13" font-weight="bold">基带 Q 路（1.8V）</text>
  <text x="410" y="487" text-anchor="middle" font-size="11">同构 · 与 I 路镜像对称</text>
  <text x="410" y="504" text-anchor="middle" font-size="11">（共质心/等长）</text>
  <text x="410" y="521" text-anchor="middle" font-size="11"> </text>

  <!-- mixers -->
  <rect x="520" y="300" width="100" height="110" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="570" y="340" text-anchor="middle" font-size="13" font-weight="bold">混频 I</text>
  <text x="570" y="360" text-anchor="middle" font-size="11">gm 共源共栅 +</text>
  <text x="570" y="376" text-anchor="middle" font-size="11">25% 占空无源开关</text>
  <rect x="520" y="430" width="100" height="100" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="570" y="470" text-anchor="middle" font-size="13" font-weight="bold">混频 Q</text>
  <text x="570" y="490" text-anchor="middle" font-size="11">LO 90°/270°</text>

  <!-- drivers -->
  <rect x="650" y="300" width="110" height="110" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="705" y="340" text-anchor="middle" font-size="13" font-weight="bold">驱动级 5/6G</text>
  <text x="705" y="360" text-anchor="middle" font-size="11">+6 dB（1.8V）</text>
  <text x="705" y="378" text-anchor="middle" font-size="11">差分 · 中和电容</text>
  <rect x="650" y="430" width="110" height="100" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="705" y="470" text-anchor="middle" font-size="13" font-weight="bold">驱动级 2.4G</text>
  <text x="705" y="490" text-anchor="middle" font-size="11">同构</text>

  <!-- PAs -->
  <rect x="780" y="290" width="160" height="130" fill="#ffcdd2" stroke="#b71c1c" stroke-width="2.4"/>
  <text x="860" y="335" text-anchor="middle" font-size="14" font-weight="bold">功率级 PA 5/6G</text>
  <text x="860" y="357" text-anchor="middle" font-size="11">3.3V 厚氧 · 差分共源共栅</text>
  <text x="860" y="374" text-anchor="middle" font-size="11">PSAT +32 dBm · PAE≥30%</text>
  <text x="860" y="391" text-anchor="middle" font-size="11">开关电容调谐 4.9–7.125G</text>
  <rect x="780" y="440" width="160" height="120" fill="#ffcdd2" stroke="#b71c1c" stroke-width="2.4"/>
  <text x="860" y="482" text-anchor="middle" font-size="14" font-weight="bold">功率级 PA 2.4G</text>
  <text x="860" y="504" text-anchor="middle" font-size="11">+23 dBm 档 · PAE 35%</text>
  <text x="860" y="521" text-anchor="middle" font-size="11">独立片上变压器</text>

  <!-- transformers -->
  <rect x="950" y="300" width="70" height="120" fill="#ffffff" stroke="#b71c1c" stroke-width="2"/>
  <text x="985" y="352" text-anchor="middle" font-size="12" font-weight="bold">TXFM</text>
  <text x="985" y="370" text-anchor="middle" font-size="11">合成/巴伦</text>
  <rect x="950" y="445" width="70" height="115" fill="#ffffff" stroke="#b71c1c" stroke-width="2"/>
  <text x="985" y="494" text-anchor="middle" font-size="12" font-weight="bold">TXFM</text>
  <text x="985" y="512" text-anchor="middle" font-size="11">合成/巴伦</text>
  <line x1="940" y1="355" x2="950" y2="360" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="940" y1="500" x2="950" y2="500" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1020" y1="360" x2="1276" y2="350" stroke="#b71c1c" stroke-width="2.5" marker-end="url(#arrR)"/>
  <line x1="1020" y1="500" x2="1276" y2="550" stroke="#b71c1c" stroke-width="2.5" marker-end="url(#arrR)"/>

  <!-- RF chain arrows -->
  <line x1="500" y1="355" x2="520" y2="355" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="485" x2="520" y2="485" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="620" y1="355" x2="650" y2="355" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="620" y1="485" x2="650" y2="485" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="760" y1="355" x2="780" y2="355" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="760" y1="485" x2="780" y2="500" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="633" y="552" text-anchor="middle" font-size="10.5" fill="#555">混频输出 RF 合成 → 频段分路（开关）</text>

  <!-- isolation boxes -->
  <rect x="766" y="278" width="268" height="296" fill="none" stroke="#b71c1c" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="770" y="270" font-size="11" fill="#b71c1c">PA 岛：双 guard ring + 深沟槽 + 3.3V 专用电源环</text>
  <rect x="308" y="286" width="324" height="266" fill="none" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="314" y="570" font-size="11" fill="#2e7d32">敏感模拟：guard ring + 干净 1.8V 电源域（与 LO 岛间距 ≥100µm）</text>

  <!-- coupler / detector -->
  <rect x="780" y="600" width="240" height="70" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
  <text x="900" y="628" text-anchor="middle" font-size="13" font-weight="bold">定向耦合器 −25dB → 功率检测</text>
  <text x="900" y="648" text-anchor="middle" font-size="11">→ SAR ADC（贴 PA 输出摆置，短反馈线）</text>
  <line x1="985" y1="565" x2="900" y2="600" stroke="#00838f" stroke-width="1.6" stroke-dasharray="4,3"/>

  <!-- LDO row -->
  <rect x="160" y="620" width="560" height="80" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
  <text x="440" y="650" text-anchor="middle" font-size="13" font-weight="bold">LDO / 带隙基准（1.1V / 1.8V / 3.3V 三域）+ 密集 decap</text>
  <text x="440" y="672" text-anchor="middle" font-size="11">沿下缘排布 · 各域独立 LDO · 敏感域 LDO 加 PSRR 增强/级联</text>

  <!-- feedback path -->
  <polyline points="900,670 900,745 230,745 230,600" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="565" y="738" text-anchor="middle" font-size="11.5" fill="#c62828">校准/功控回环：检测→ADC→数字校准→DAC/VGA/LOFT 系数回写（虚线）</text>

  <!-- power grid note -->
  <text x="160" y="790" font-size="11.5" fill="#00695c">电源网格：各域独立顶环 + 正交条带；3.3V 环随 PA 岛（大电流回流最短）；全片均匀 decap 开窗；衬底背注 GND 缝合</text>

  <!-- legend -->
  <g font-size="12">
    <rect x="120" y="920" width="16" height="16" fill="#e8eaf6" stroke="#3f51b5"/><text x="142" y="933">数字</text>
    <rect x="200" y="920" width="16" height="16" fill="#e8f5e9" stroke="#2e7d32"/><text x="222" y="933">模拟基带/混频</text>
    <rect x="340" y="920" width="16" height="16" fill="#fff8e1" stroke="#f9a825"/><text x="362" y="933">LO</text>
    <rect x="410" y="920" width="16" height="16" fill="#ffcdd2" stroke="#b71c1c"/><text x="432" y="933">PA（3.3V）</text>
    <rect x="530" y="920" width="16" height="16" fill="#e0f7fa" stroke="#00838f"/><text x="552" y="933">电源/检测</text>
    <line x1="640" y1="928" x2="680" y2="928" stroke="#666" stroke-width="2" stroke-dasharray="7,4"/><text x="688" y="933">隔离边界</text>
    <line x1="790" y1="928" x2="830" y2="928" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/><text x="838" y="933">校准回环</text>
    <text x="1220" y="933" fill="#777">图 1 / 6</text>
  </g>
</svg>
