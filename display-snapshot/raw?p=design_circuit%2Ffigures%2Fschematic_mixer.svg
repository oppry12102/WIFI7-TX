<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arr6o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6a817"/>
    </marker>
  </defs>
  <rect width="1300" height="880" fill="#fafafa"/>
  <text x="650" y="34" text-anchor="middle" font-size="22" font-weight="bold">上变频混频器拓扑示意 · gm 共源共栅 + 25% 占空无源正交开关（I 路示出）</text>
  <text x="650" y="58" text-anchor="middle" font-size="13" fill="#555">净转换增益 ≈ 0 dB（gm +2 dB / 开关 −2 dB）· 25% 占空较 50% 噪声/线性更优（架构裁决）· 1.8V 域</text>

  <!-- BB inputs -->
  <circle cx="90" cy="250" r="5" fill="#37474f"/><text x="40" y="245" font-size="13">VIp（VGA）</text>
  <circle cx="90" cy="390" r="5" fill="#37474f"/><text x="40" y="410" font-size="13">VIn</text>
  <line x1="95" y1="250" x2="180" y2="250" stroke="#37474f" stroke-width="2"/>
  <line x1="95" y1="390" x2="180" y2="390" stroke="#37474f" stroke-width="2"/>

  <!-- gm stage -->
  <g stroke="#37474f" stroke-width="2.2" fill="#e8f5e9">
    <rect x="180" y="225" width="80" height="50"/>
    <rect x="180" y="365" width="80" height="50"/>
  </g>
  <text x="220" y="255" text-anchor="middle" font-size="12" font-weight="bold">M1</text>
  <text x="220" y="395" text-anchor="middle" font-size="12" font-weight="bold">M1′</text>
  <text x="220" y="215" text-anchor="middle" font-size="11" fill="#555">gm 输入级（共源）</text>
  <!-- cascode -->
  <g stroke="#37474f" stroke-width="2.2" fill="#e8f5e9">
    <rect x="180" y="140" width="80" height="46"/>
    <rect x="180" y="444" width="80" height="46"/>
  </g>
  <text x="220" y="168" text-anchor="middle" font-size="12" font-weight="bold">M2</text>
  <text x="220" y="472" text-anchor="middle" font-size="12" font-weight="bold">M2′</text>
  <text x="220" y="132" text-anchor="middle" font-size="11" fill="#555">cascode（降 Miller/提升隔离）</text>
  <line x1="220" y1="225" x2="220" y2="186" stroke="#37474f" stroke-width="2"/>
  <line x1="220" y1="415" x2="220" y2="444" stroke="#37474f" stroke-width="2"/>
  <!-- tail current -->
  <line x1="220" y1="490" x2="220" y2="530" stroke="#37474f" stroke-width="2"/>
  <g stroke="#37474f" stroke-width="2"><line x1="205" y1="530" x2="235" y2="530"/><line x1="212" y1="538" x2="228" y2="538"/><line x1="218" y1="546" x2="222" y2="546"/></g>
  <text x="235" y="548" font-size="11" fill="#555">尾电流源</text>

  <!-- switch quad -->
  <g stroke="#f9a825" stroke-width="2.4" fill="#fff8e1">
    <rect x="380" y="120" width="90" height="60"/>
    <rect x="380" y="205" width="90" height="60"/>
    <rect x="380" y="330" width="90" height="60"/>
    <rect x="380" y="415" width="90" height="60"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#7a5c00">
    <text x="425" y="155" text-anchor="middle">M3（LO 0°）</text>
    <text x="425" y="240" text-anchor="middle">M4（LO 180°）</text>
    <text x="425" y="365" text-anchor="middle">M5（LO 0°）</text>
    <text x="425" y="450" text-anchor="middle">M6（LO 180°）</text>
  </g>
  <line x1="260" y1="163" x2="380" y2="163" stroke="#37474f" stroke-width="2"/>
  <line x1="260" y1="330" x2="380" y2="237" stroke="#37474f" stroke-width="2"/>
  <line x1="260" y1="310" x2="380" y2="362" stroke="#37474f" stroke-width="2"/>
  <line x1="260" y1="467" x2="380" y2="447" stroke="#37474f" stroke-width="2"/>
  <text x="330" y="300" font-size="10.5" fill="#555">（节点交叉即极性反相）</text>

  <!-- RF summing node -->
  <circle cx="570" cy="290" r="6" fill="#b71c1c"/>
  <text x="570" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">RF 节点</text>
  <polyline points="470,150 540,150 540,290 570,290" fill="none" stroke="#37474f" stroke-width="2.2"/>
  <polyline points="470,235 520,235 520,290 570,290" fill="none" stroke="#37474f" stroke-width="2.2"/>
  <polyline points="470,360 520,360 520,290 570,290" fill="none" stroke="#37474f" stroke-width="2.2"/>
  <polyline points="470,445 540,445 540,290 570,290" fill="none" stroke="#37474f" stroke-width="2.2"/>

  <!-- tuned load -->
  <g stroke="#37474f" stroke-width="2" fill="none">
    <line x1="570" y1="284" x2="570" y2="220"/>
    <line x1="555" y1="220" x2="585" y2="220"/><line x1="560" y1="212" x2="580" y2="212"/><line x1="565" y1="204" x2="575" y2="204"/>
    <line x1="570" y1="204" x2="570" y2="150"/>
  </g>
  <text x="595" y="212" font-size="11" fill="#555">LC 调谐负载（片上电感，Q 优化）</text>
  <line x1="570" y1="150" x2="570" y2="130" stroke="#00838f" stroke-width="2"/>
  <text x="595" y="140" font-size="11.5" fill="#00838f">1.8V（模拟域 LDO）</text>

  <!-- output -->
  <line x1="570" y1="290" x2="660" y2="290" stroke="#37474f" stroke-width="2.5" marker-end="url(#arr6)"/>
  <text x="670" y="295" font-size="13" font-weight="bold">→ 驱动级（图 4）</text>

  <!-- Q channel ghost -->
  <rect x="720" y="120" width="170" height="355" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="805" y="150" text-anchor="middle" font-size="12.5" fill="#666">Q 路同构（虚框）</text>
  <text x="805" y="175" text-anchor="middle" font-size="11.5" fill="#666">开关栅 LO 90°/270°</text>
  <text x="805" y="197" text-anchor="middle" font-size="11.5" fill="#666">RF 输出与 I 路正交求和</text>
  <text x="805" y="240" text-anchor="middle" font-size="11.5" fill="#666">版图：与 I 路镜像对称/共质心，</text>
  <text x="805" y="262" text-anchor="middle" font-size="11.5" fill="#666">四相走线等长（图 3 规则）</text>

  <!-- 25% timing -->
  <rect x="80" y="570" width="1140" height="200" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  <text x="95" y="598" font-size="13" font-weight="bold" fill="#37474f">25% 占空四相门控时序（非交叠，每相 1/4 周期导通）</text>
  <!-- timeline -->
  <line x1="150" y1="740" x2="1190" y2="740" stroke="#555" stroke-width="1.5"/>
  <text x="1200" y="745" font-size="11" fill="#555">t</text>
  <g font-size="11" fill="#777">
    <text x="150" y="758">0°</text><text x="400" y="758">90°</text><text x="650" y="758">180°</text><text x="900" y="758">270°</text><text x="1150" y="758">360°</text>
    <line x1="150" y1="620" x2="150" y2="740" stroke="#ddd" stroke-width="1"/>
    <line x1="400" y1="620" x2="400" y2="740" stroke="#ddd" stroke-width="1"/>
    <line x1="650" y1="620" x2="650" y2="740" stroke="#ddd" stroke-width="1"/>
    <line x1="900" y1="620" x2="900" y2="740" stroke="#ddd" stroke-width="1"/>
    <line x1="1150" y1="620" x2="1150" y2="740" stroke="#ddd" stroke-width="1"/>
  </g>
  <g fill="#f9a825" stroke="#7a5c00" stroke-width="1">
    <rect x="150" y="620" width="60" height="24"/><rect x="400" y="646" width="60" height="24"/>
    <rect x="650" y="620" width="60" height="24"/><rect x="900" y="646" width="60" height="24"/>
  </g>
  <g font-size="11.5" fill="#7a5c00">
    <text x="152" y="616">LO 0°（M3/M5 栅高）</text>
    <text x="402" y="688">LO 90°</text>
    <text x="652" y="616">LO 180°</text>
    <text x="902" y="688">LO 270°</text>
  </g>
  <text x="95" y="745" font-size="0" fill="none">.</text>
  <text x="770" y="620" font-size="11.5" fill="#555">效果：本征噪声折叠减半、开关共导更短→线性/LOFT 更优；</text>
  <text x="770" y="640" font-size="11.5" fill="#555">占空误差→正交误差→EVM 灵敏度（架构风险 #4，整形器贴近混频器）</text>

  <text x="1180" y="850" font-size="12" fill="#777">图 6 / 6</text>
</svg>
